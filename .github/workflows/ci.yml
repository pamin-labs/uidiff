name: CI

# A pull request runs every check. A push to main has already passed them on
# its pull request, so it only builds the release targets the merge produced.
'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # With no version override, setup-zig reads minimum_zig_version from build.zig.zon.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - run: zig fmt --check .

  test:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-24.04-arm
            rows_only: true
          - os: macos-15-intel
            rows_only: true
          - os: windows-11-arm
            rows_only: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          cache-key: ${{ matrix.os }}
      - run: zig build test
        if: ${{ !matrix.rows_only }}
      - run: zig build e2e
        if: ${{ !matrix.rows_only }}
      - run: zig build test-threaded
        if: runner.os == 'Linux' && !matrix.rows_only
      - run: zig build test-x86-fallback
        if: runner.os == 'Linux' && runner.arch == 'X64'

      - run: zig build test-png-rows
        if: matrix.rows_only

  clean-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false
      - run: |
          zig build -Doptimize=safe
          zig build test
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/uidiff-clean-zig-cache

  release-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # wasm32-wasi joins the matrix when the WASM entry point is implemented.
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
          - aarch64-windows
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          cache-key: ${{ matrix.target }}
      - run: zig build size -Doptimize=safe -Dtarget="${{ matrix.target }}"

  font:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: python3 scripts/generate-font.py --check

  fuzz:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - run: bash scripts/fuzz.sh

  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - run: zig build bench
