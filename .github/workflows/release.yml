name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: python3 scripts/release/package.py version --tag "$TAG"
        env:
          TAG: ${{ github.ref_name }}

  build:
    needs: version
    uses: ./.github/workflows/build-release-targets.yml
    with:
      package: true

  github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tap_repository: ${{ steps.tap.outputs.repository }}
      tap_formula: ${{ steps.tap.outputs.formula }}
      tap_asset: ${{ steps.tap.outputs.asset }}
      version: ${{ steps.tap.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: uidiff-*
          path: release
          merge-multiple: true
      - id: tap
        run: python3 scripts/release/package.py tap >> "$GITHUB_OUTPUT"
      - run: python3 scripts/release/package.py finalize release
      - run: |
          options=()
          if [[ "$TAG" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --generate-notes "${options[@]}" release/*
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
      - if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: homebrew-formula
          path: release/${{ steps.tap.outputs.asset }}
          if-no-files-found: error

  homebrew:
    needs: github
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    concurrency:
      group: homebrew-formula
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: homebrew-formula
          path: formula-asset
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ needs.github.outputs.tap_repository }}
          ref: main
          path: tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - working-directory: tap
        run: |
          cp "../formula-asset/$ASSET" "$FORMULA"
          git add -- "$FORMULA"
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "uidiff $VERSION"
          git push origin HEAD:main
        env:
          ASSET: ${{ needs.github.outputs.tap_asset }}
          FORMULA: ${{ needs.github.outputs.tap_formula }}
          VERSION: ${{ needs.github.outputs.version }}

  r2:
    needs: github
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      BUCKET: s3://uidiff
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: gh release download "$TAG" --dir release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
      - run: python3 scripts/release/package.py mirror release mirror
      # Tagged files never change; latest and the installers move with each stable release,
      # and they go up last so they never name files the bucket lacks.
      - run: |
          aws s3 cp --recursive mirror/download "$BUCKET/download" --cache-control "public, max-age=31536000, immutable"
          if [[ -d mirror/latest ]]; then
            aws s3 cp --recursive mirror/latest "$BUCKET/latest" --cache-control "public, max-age=300"
            for installer in install.sh install.ps1; do
              aws s3 cp "mirror/$installer" "$BUCKET/$installer" --cache-control "public, max-age=300" --content-type "text/plain; charset=utf-8"
            done
          fi

  npm:
    needs: github
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: uidiff-*
          path: release
          merge-multiple: true
      - run: |
          mkdir -p stage
          python3 scripts/release/package.py npm release stage/npm >stage/npm-order.txt
      - run: |
          dist_tag=latest
          if [[ "$TAG" == *-* ]]; then dist_tag=next; fi
          while IFS= read -r package; do
            # A rerun skips versions an earlier attempt already published.
            spec=$(node -p 'const p = require(require("path").resolve(process.argv[1])); p.name + "@" + p.version' "./$package/package.json")
            if npm view "$spec" version >/dev/null 2>&1; then continue; fi
            npm publish "./$package" --access public --provenance --tag "$dist_tag"
          done <stage/npm-order.txt
        env:
          TAG: ${{ github.ref_name }}
