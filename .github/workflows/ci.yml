name: CI

# A pull request runs every check. A push to main runs only the quick Linux
# checks, and none for documentation; the release workflow builds every target.
'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'skills/**', 'bench/README.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # With no version override, setup-zig reads minimum_zig_version from build.zig.zon.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - run: zig fmt --check .

  test:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-24.04-arm
            rows_only: true
          - os: macos-15-intel
            rows_only: true
          - os: windows-11-arm
            rows_only: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          cache-key: ${{ matrix.os }}
      - run: zig build test
        if: ${{ !matrix.rows_only }}
      - run: zig build e2e
        if: ${{ !matrix.rows_only }}
      - run: python -B scripts/release/test_launcher.py
        if: ${{ !matrix.rows_only }}
      - run: sh scripts/release/test_install.sh
        if: ${{ !matrix.rows_only && runner.os != 'Windows' }}
      - run: ./scripts/release/test_install.ps1
        if: ${{ !matrix.rows_only && runner.os == 'Windows' }}
        shell: pwsh
      - run: zig build test-threaded
        if: runner.os == 'Linux' && !matrix.rows_only
      - run: zig build test-x86-fallback
        if: runner.os == 'Linux' && runner.arch == 'X64'

      - run: zig build test-png-rows
        if: matrix.rows_only

  clean-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false
      - run: |
          zig build -Doptimize=safe
          zig build test
          python3 -B scripts/release/test_source_package.py
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/uidiff-clean-zig-cache

  release-build:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/build-release-targets.yml

  quick:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - run: zig fmt --check .
      - run: zig build test

  lint:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: '1.7.12'
      SHELLCHECK_VERSION: '0.11.0'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Check workflows and the installer
        shell: bash
        run: |
          tools=$(mktemp -d)
          cd "$tools"
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          sha256sum --check <<'EOF'
          8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz
          8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz
          EOF
          tar -xzf actionlint.tar.gz actionlint
          tar -xJf shellcheck.tar.xz --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          cd "$GITHUB_WORKSPACE"
          export PATH="$tools:$PATH"
          actionlint
          shellcheck install.sh scripts/release/test_install.sh

  font:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: python3 scripts/generate-font.py --check
      - run: python3 scripts/readme-images.py check
      - run: python3 scripts/test-readme-images.py

  fuzz:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - run: bash scripts/fuzz.sh

  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - run: zig build bench
