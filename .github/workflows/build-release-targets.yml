name: Build ReleaseSafe targets

on:
  workflow_call:
    inputs:
      package:
        type: boolean
        default: false
      ref:
        description: Commit to build; empty builds the triggering commit.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: targets
        run: |
          matrix=$(python3 scripts/release/package.py matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          cache-key: ${{ matrix.target }}
      - run: zig build install size -Doptimize=safe -Dtarget="$TARGET"
      - if: inputs.package
        run: python3 scripts/release/package.py pack "$TARGET" zig-out/bin release
      - if: inputs.package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uidiff-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
