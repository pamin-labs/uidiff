name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: python3 scripts/release/package.py version --tag "$TAG"
        env:
          TAG: ${{ github.ref_name }}

  build:
    needs: version
    uses: ./.github/workflows/build-release-targets.yml
    with:
      package: true

  github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: uidiff-*
          path: release
          merge-multiple: true
      - run: python3 scripts/release/package.py finalize release
      - run: |
          options=()
          if [[ "$TAG" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --generate-notes "${options[@]}" release/*
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}

  npm:
    needs: github
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: uidiff-*
          path: release
          merge-multiple: true
      - run: python3 scripts/release/package.py npm release stage/npm
      - run: |
          dist_tag=latest
          if [[ "$TAG" == *-* ]]; then dist_tag=next; fi
          for package in ./stage/npm/@uidiff/*; do
            npm publish "$package" --access public --provenance --tag "$dist_tag"
          done
          npm publish ./stage/npm/uidiff --access public --provenance --tag "$dist_tag"
        env:
          TAG: ${{ github.ref_name }}
